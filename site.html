<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Liquid Glass for the Web</title>
    <meta name="description" content="Liquid Glass for the web." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Liquid Glass for the Web" />
    <meta property="og:description" content="Faithful Liquid Glass w/ WebGPU and HTML-in-Canvas." />
    <meta property="og:image" content="/site/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A lock screen's 9:41 in Liquid Glass over pink flowers, a notification: Liquid Glass is now on the web." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/site/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/site/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/site/apple-touch-icon.png" />
    <style>
      #site-boot { position: fixed; left: 0; top: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; width: 100%;
        height: calc(100vh - 70px); height: calc(100dvh - 70px); min-height: 560px; transition: opacity .35s ease;
        background: radial-gradient(60% 55% at 50% 100%, rgba(0, 20, 30, .45), rgba(0, 20, 30, .18) 55%, transparent 100%), url(/site/hero.jpg) center / cover no-repeat, #16808b; }
      @media (max-width: 759px) { #site-boot { height: calc(100vh - 62px); height: calc(100dvh - 62px); } }
      #site-boot svg { width: 30px; height: 30px; animation: site-boot-spin .8s steps(8) infinite; }
      @keyframes site-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #site-boot svg { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="site-boot" aria-label="Loading" role="progressbar"><svg viewBox="-15 -15 30 30" aria-hidden="true">
      <g stroke="#fff" stroke-width="2.6" stroke-linecap="round">
        <line y1="-6.5" y2="-12" opacity="1" /><line y1="-6.5" y2="-12" opacity=".87" transform="rotate(-45)" /><line y1="-6.5" y2="-12" opacity=".74" transform="rotate(-90)" /><line y1="-6.5" y2="-12" opacity=".61" transform="rotate(-135)" />
        <line y1="-6.5" y2="-12" opacity=".48" transform="rotate(-180)" /><line y1="-6.5" y2="-12" opacity=".38" transform="rotate(-225)" /><line y1="-6.5" y2="-12" opacity=".3" transform="rotate(-270)" /><line y1="-6.5" y2="-12" opacity=".24" transform="rotate(-315)" />
      </g></svg></div>
    <div id="root"></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
